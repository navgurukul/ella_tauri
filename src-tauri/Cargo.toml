[package]
name = "ella-tauri"
version = "0.1.0"
description = "ZoSpeak desktop proof of concept"
authors = ["NavGurukul"]
edition = "2021"
default-run = "ella-tauri"

[lib]
name = "ella_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.2.2", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
transcribe-cpp = { version = "=0.2.2", default-features = false, features = ["vulkan", "dynamic-backends"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
transcribe-cpp = { version = "=0.2.2", default-features = false }

[dev-dependencies]
tempfile = "3"
