[package]
name = "ella-tauri"
version = "0.1.19"
description = "ZoSpeak desktop proof of concept"
authors = ["NavGurukul"]
edition = "2021"
default-run = "ella-tauri"

[lib]
name = "ella_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustrict = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
transcribe-cpp = { version = "=0.2.2", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
num_cpus = "1"
transcribe-cpp = { version = "=0.2.2", default-features = false, features = ["dynamic-backends", "vulkan"] }
# The version Tauri already builds; telemetry reads the power state and CPU
# load through it (`machine`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
num_cpus = "1"
transcribe-cpp = { version = "=0.2.2", default-features = false }

[dev-dependencies]
tempfile = "3"
