# Measures, on a Windows machine, the per-turn work whose cost depends on the
# operating system (src-tauri/src/bin/latency-probe.rs) and Canary's
# stop-to-final time (stt-benchmark), for the commit pushed.
#
# A development Mac cannot build the MSVC target, so this is how a change to a
# Windows path gets a before and an after: push the branch with the change and
# compare with the run of the commit before it. The runner is a CPU-only VM
# with Defender's real-time scanning on, not a classroom laptop, so its numbers
# are for comparing commits with each other, not for promising a learner a time.
#
# Each result is posted as a notice on the run (readable without signing in)
# and uploaded as an artifact.
name: Latency probe

on:
  push:
    branches: ["perf/**"]
    paths:
      - "src-tauri/**"
      - ".github/workflows/latency-probe.yml"

env:
  ELLA_LLAMA_TAG: b11405
  # What the launch A/B compares HEAD with: the commit before "Load Canary
  # while llama-server starts", which already has the launch probe.
  PROBE_BEFORE: 6a70923

jobs:
  windows:
    # A commit marked [launch-ab] runs only the launch A/B below.
    if: ${{ !contains(github.event.head_commit.message, '[launch-ab]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: false
          cache: true

      # Tauri's context macro reads the built frontend.
      - run: npm ci
      - run: npm run build

      # The public en_US voice: the probe needs a voice, not Ella's.
      - name: Stage the Windows engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-windows-engines.ps1

      - name: Fetch Canary
        shell: bash
        run: |
          mkdir -p src-tauri/resources/engines/models/stt
          curl -sSfL --retry 5 -o src-tauri/resources/engines/models/stt/canary-180m-flash-Q8_0.gguf \
            https://huggingface.co/handy-computer/canary-180m-flash-gguf/resolve/456e6049062ecf06f1a0f4607f2ee3dc80ebbf8a/canary-180m-flash-Q8_0.gguf

      - name: Build
        working-directory: src-tauri
        run: |
          cargo build --release --bin latency-probe --bin stt-benchmark
          Copy-Item transcribe-libs\*.dll target\release\

      # The hosted image turns real-time scanning off; a learner's laptop has
      # it on, and it is what makes small files in %TEMP% slow. Probe with it on.
      - name: Turn Defender's real-time scanning on
        shell: pwsh
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 5

      - name: Machine
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1)
          $mp = Get-MpComputerStatus
          $line = "cpu=$($cpu.Name) cores=$($cpu.NumberOfCores) threads=$($cpu.NumberOfLogicalProcessors) os=$((Get-CimInstance Win32_OperatingSystem).Caption) defender_realtime=$($mp.RealTimeProtectionEnabled) temp=$env:TEMP"
          Write-Host $line
          Write-Host "::notice title=machine::$line"

      - name: Latency probe
        working-directory: src-tauri
        env:
          ELLA_ENGINE_ROOT: ${{ github.workspace }}\src-tauri\resources\engines
        run: |
          target\release\latency-probe.exe --rounds 10 --audio ..\bench\fixtures\jfk.wav --output probe-results\windows.json

      # Canary at the library's default thread count (every logical CPU, at
      # most 8: what the app uses) and at fixed counts, to see whether
      # hyperthreads help it on a CPU-only Windows machine.
      - name: Canary
        working-directory: src-tauri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          Get-ChildItem target\release\*.dll | ForEach-Object { Write-Host "dll: $($_.Name)" }
          $failed = 0
          foreach ($threads in 0, 2, 4) {
            $out = & target\release\stt-benchmark.exe --audio ..\bench\fixtures\jfk.wav --duration-ms 4214 --warmup 1 --iterations 7 --threads $threads --canary-model resources\engines\models\stt\canary-180m-flash-Q8_0.gguf --output "probe-results\canary-threads-$threads.json" 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) {
              $tail = (($out -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 6) -join ' | ')
              Write-Host "::error title=canary threads=$threads::exit $code $tail"
              $failed = 1
            }
          }
          exit $failed

      # The suite on Windows, where the changes being measured run. -cmatch:
      # PowerShell's -match ignores case, and test names say "failed" too.
      - name: Tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $out = cargo test --release 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $lines = $out -split "`n"
          $failed = ($lines | Where-Object { $_ -cmatch '^test .* FAILED' } | ForEach-Object { ($_ -split ' ')[1] }) -join ', '
          $summary = ($lines | Where-Object { $_ -cmatch '^test result: FAILED|^test result: ok\. [1-9]' }) -join ' | '
          Write-Host "::notice title=tests::exit $code $summary FAILED: $failed"
          exit $code

      - name: Post results
        if: always()
        shell: python
        run: |
          import json, pathlib
          def brief(value):
              if isinstance(value, dict) and "p50" in value:
                  return f"p50={value['p50']} p95={value['p95']} n={value['n']}"
              if isinstance(value, dict):
                  return {key: brief(inner) for key, inner in value.items()}
              return value
          for path in sorted(pathlib.Path("src-tauri/probe-results").glob("*.json")):
              if path.stem.startswith("launch-"):
                  continue
              data = json.loads(path.read_text())
              text = json.dumps(brief(data), separators=(",", ":"))
              print(f"::notice title={path.stem}::{text[:4000]}")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-probe-${{ github.sha }}
          path: src-tauri/probe-results/

  # Engine start-up (what the setup screen waits for on every launch) at
  # PROBE_BEFORE and at HEAD, on one machine. Each sample is its own process
  # (`--rounds 1`), the two are interleaved in ABBA order so drift over the job
  # falls on both equally, and an A/A arm (HEAD against a copy of itself) run
  # the same way measures the noise floor. Every raw sample is posted.
  launch-ab:
    if: ${{ contains(github.event.head_commit.message, '[launch-ab]') }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: false
          cache: true

      - run: npm ci
      - run: npm run build

      - name: Stage the Windows engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-windows-engines.ps1

      - name: Fetch Canary and the language model
        shell: bash
        run: |
          mkdir -p src-tauri/resources/engines/models/stt src-tauri/resources/engines/models/llm
          curl -sSfL --retry 5 -o src-tauri/resources/engines/models/stt/canary-180m-flash-Q8_0.gguf \
            https://huggingface.co/handy-computer/canary-180m-flash-gguf/resolve/456e6049062ecf06f1a0f4607f2ee3dc80ebbf8a/canary-180m-flash-Q8_0.gguf
          curl -sSfL --retry 5 -o src-tauri/resources/engines/models/llm/model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf

      # Both from the same checkout, so only src/ differs.
      - name: Build before and after
        working-directory: src-tauri
        run: |
          git checkout $env:PROBE_BEFORE -- src
          cargo build --release --bin latency-probe
          Copy-Item target\release\latency-probe.exe target\release\probe-before.exe
          git checkout HEAD -- src
          cargo build --release --bin latency-probe
          Copy-Item target\release\latency-probe.exe target\release\probe-after.exe
          Copy-Item target\release\latency-probe.exe target\release\probe-after2.exe
          Copy-Item transcribe-libs\*.dll target\release\

      - name: Turn Defender's real-time scanning on
        shell: pwsh
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 5

      - name: Machine
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1)
          $mp = Get-MpComputerStatus
          Write-Host "::notice title=machine::cpu=$($cpu.Name) cores=$($cpu.NumberOfCores) threads=$($cpu.NumberOfLogicalProcessors) defender_realtime=$($mp.RealTimeProtectionEnabled)"

      # One unrecorded launch of each binary first: the first start after a
      # build pays for Defender scanning the new files, which is not the change.
      - name: Launch A/B and A/A
        working-directory: src-tauri
        shell: pwsh
        env:
          ELLA_ENGINE_ROOT: ${{ github.workspace }}\src-tauri\resources\engines
        run: |
          function Launch($exe) {
            & "target\release\$exe" --only launch --rounds 1 --output probe-results\launch.json | Out-Null
            [math]::Round((Get-Content probe-results\launch.json | ConvertFrom-Json).launch.engine_ready_ms.p50, 1)
          }
          foreach ($exe in 'probe-before.exe', 'probe-after.exe', 'probe-after2.exe') { Launch $exe | Out-Null }
          $samples = @{ 'ab_before' = @(); 'ab_after' = @(); 'aa_a' = @(); 'aa_b' = @() }
          foreach ($block in 1..10) {
            # ABBA within each block, alternating which arm leads.
            $order = if ($block % 2) { 'before','after','after','before' } else { 'after','before','before','after' }
            foreach ($which in $order) {
              $exe = if ($which -eq 'before') { 'probe-before.exe' } else { 'probe-after.exe' }
              $samples["ab_$which"] += Launch $exe
            }
            $order = if ($block % 2) { 'a','b','b','a' } else { 'b','a','a','b' }
            foreach ($which in $order) {
              $exe = if ($which -eq 'a') { 'probe-after.exe' } else { 'probe-after2.exe' }
              $samples["aa_$which"] += Launch $exe
            }
          }
          foreach ($arm in 'ab_before', 'ab_after', 'aa_a', 'aa_b') {
            Write-Host "::notice title=$arm (engine_ready_ms, n=$($samples[$arm].Count))::$($samples[$arm] -join ' ')"
          }
