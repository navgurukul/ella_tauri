# Builds the Windows installer, the Apple Silicon Mac app and the Intel Mac app,
# each on its own runner, and publishes all three to one release, together with
# the signed `latest.json` that installed copies poll for updates.
#
# A development Mac cannot cross-compile the MSVC target, so this workflow is
# the only way a Windows build gets made.
#
# Cutting a release:
#   npm version patch --no-git-tag-version   # keep package.json, Cargo.toml
#   # and src-tauri/tauri.conf.json on the same version
#   git tag v0.1.1 && git push origin main --tags
#
# The tag triggers the build and publishes the release immediately, so every
# installed copy picks it up on its next launch. That is right while the
# testers are the team and a fast loop matters more than a gate.
#
# Before Ella goes to people who are not us, put the gate back: set
# `releaseDraft: true` below. A draft is not "latest", so `latest.json` keeps
# pointing at the previous version until a human publishes — which is the only
# thing standing between a bad build and every installed copy.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the release to (e.g. v0.1.1)"
        required: true
      # Adds one platform to a release that already exists without rebuilding
      # the other, e.g. a Mac build for a version whose Mac job failed. The
      # build uses the branch the run is started from, not the tag, and
      # tauri-action merges its entry into the release's existing latest.json.
      platforms:
        description: "Which builds to run"
        type: choice
        options: [all, windows, macos]
        default: all

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platforms != 'macos'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # transcribe.cpp compiles its Vulkan backend from GLSL, so the build host
      # needs glslc. The runtime does not: the packaged app keeps the CPU
      # module and only uses Vulkan where a driver provides it.
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: false
          cache: true

      - run: npm ci

      # Binaries only. Weights are downloaded by the app on first launch,
      # because a release asset cannot exceed 2 GB.
      - name: Stage the Windows engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELLA_PIPER_VOICE_URL: ${{ secrets.ELLA_PIPER_VOICE_URL }}
        run: ./scripts/fetch-windows-engines.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the bundle carries no signature and every installed
          # copy rejects the update as untrusted.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Ella __VERSION__"
          releaseBody: |
            Windows installer (`-setup.exe`) and Mac apps for Ella: `aarch64.dmg`
            for Apple Silicon, `x64.dmg` for Intel Macs.

            On first launch Ella downloads about 2.3 GB of speech and language
            models, once, resuming if the connection drops. Keep about 3 GB free.

            Neither build is code-signed, so the first launch is blocked once:
            - Windows: on the SmartScreen warning, choose **More info** then **Run anyway**.
            - Mac: open the app once, then choose **Open Anyway** in System Settings → Privacy & Security.
          # Publishing on tag: see the note at the top before widening the
          # audience beyond the team.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # latest.json must point at the NSIS installer: the MSI cannot
          # update a per-user install without elevation.
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc

  macos:
    # After Windows rather than beside it: each job merges its platform into
    # the release's one latest.json, and two jobs rewriting it at the same
    # moment can drop the other's entry. It also means the release, and its
    # body above, already exist by the time this uploads into it.
    needs: windows
    # Runs when Windows succeeded, or was deliberately skipped by a macos-only
    # dispatch; a job whose dependency was skipped is otherwise skipped too.
    if: >-
      !cancelled() && needs.windows.result != 'failure' &&
      (github.event_name == 'push' || inputs.platforms != 'windows')
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Binaries and a relocatable Python for Piper; weights still come down
      # on first launch, as on Windows.
      - name: Stage the macOS engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELLA_PIPER_VOICE_URL: ${{ secrets.ELLA_PIPER_VOICE_URL }}
        run: ./scripts/fetch-macos-engines.sh

      # Not signed or notarized by Apple: there is no Developer ID yet, so
      # Gatekeeper blocks the first launch until the tester allows it. The
      # updater signature below is separate and still required.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Ella __VERSION__"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin

  macos-intel:
    # Same shape as the Apple Silicon job, on GitHub's Intel Mac runner, and
    # after it for the same latest.json reason. An Intel Mac cannot run the
    # arm64 build at all, and the updater only offers what latest.json lists
    # for the platform asking.
    needs: macos
    if: >-
      !cancelled() && needs.macos.result != 'failure' &&
      (github.event_name == 'push' || inputs.platforms != 'windows')
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The script stages for the architecture it runs on, so this runner
      # gets llama.cpp's macos-x64 build and an x86_64 Python with Piper's
      # Intel wheels.
      - name: Stage the macOS engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELLA_PIPER_VOICE_URL: ${{ secrets.ELLA_PIPER_VOICE_URL }}
        run: ./scripts/fetch-macos-engines.sh

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Ella __VERSION__"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target x86_64-apple-darwin
